spring.application.name=avanovadigital
server.port=8080

# Banco H2 em memória (os dados somem ao reiniciar a API)
spring.datasource.url=jdbc:h2:mem:avanovadigital;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
